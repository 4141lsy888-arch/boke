name = "boke-api"
main = "index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Custom domains (China-accessible, auto DNS provisioning)
routes = [
  { pattern = "api.1114lsy.xyz", custom_domain = true },
  { pattern = "blog.1114lsy.xyz", custom_domain = true }
]

# Static site assets (served first; /api/* falls through to worker)
[assets]
directory = "./site"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "boke-d1"
database_id = "7f5ce7b6-0ffa-467e-9ff6-87afafff0ead"

# Logging
[observability]
enabled = true
