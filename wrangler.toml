# 根目录配置：供 Cloudflare Workers Builds 在仓库根目录执行 `npx wrangler deploy` 使用
# 指向 cloudflare-worker/ 中的 Worker 代码与静态资源，与 cloudflare-worker/wrangler.toml 等效
name = "boke-api"
main = "cloudflare-worker/index.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# 自定义域名（国内可直连；已开通，重复声明为无操作）
routes = [
  { pattern = "api.1114lsy.xyz", custom_domain = true },
  { pattern = "blog.1114lsy.xyz", custom_domain = true }
]

# 静态站点资源（优先服务；/api/* 回落到 Worker）
[assets]
directory = "./cloudflare-worker/site"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "boke-d1"
database_id = "60c976d4-438b-418f-b2fe-9734a3468e00"

# 日志
[observability]
enabled = true
