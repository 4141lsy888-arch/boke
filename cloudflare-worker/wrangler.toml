name = "boke-api"
main = "index.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Custom domains (China-accessible, auto DNS provisioning)
routes = [
  { pattern = "api.1114lsy.xyz", custom_domain = true },
  { pattern = "blog.1114lsy.xyz", custom_domain = true }
]

# Static site assets (served first; /api/* falls through to worker)
[assets]
directory = "./site"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "boke-d1"
database_id = "60c976d4-438b-418f-b2fe-9734a3468e00"

# Logging
[observability]
enabled = true
